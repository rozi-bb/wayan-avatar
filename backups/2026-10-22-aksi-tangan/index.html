<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wayan</title>
<style>
  :root {
    --bg: #1d1d1d; --stage: #282828; --panel: #2a2a2a; --text: #f2f2f2; --muted: #a8a8a8;
    --line: #4a4a4a; --accent: #f5bf03; --error: #ff8a80;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .stage { width: 100%; max-width: 420px; background: var(--stage); border-radius: 24px; }
  canvas { display: block; width: 100%; aspect-ratio: 2 / 3; }
  .voice { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .voice code { font: 15px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
  select { font: inherit; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); max-width: 100%; }
  .say { display: flex; gap: 12px; width: 100%; }
  input[type=text] { flex: 1; min-width: 0; font: inherit; font-size: 18px; padding: 12px 16px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  button { font: inherit; padding: 12px 20px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); cursor: pointer; }
  #speak { background: var(--accent); border-color: var(--accent); color: #1d1d1d; font-weight: 700; }
  button:disabled { opacity: .45; cursor: default; }
  .hint { color: var(--muted); font-size: 14px; text-align: center; margin: 0; }
  .status { min-height: 1.4em; font-size: 14px; margin: 0; text-align: center; }
  .status.error { color: var(--error); font-weight: 600; }
  @media (max-width: 520px) { .say { flex-direction: column; } }
  .debug { width: 100%; border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .debug[hidden] { display: none; }
  .debug .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .debug button { padding: 8px 14px; font-size: 14px; }
  .debug label, .debug output { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <div class="stage"><canvas id="c" width="840" height="1260"></canvas></div>

  <div class="voice">
    <code id="voiceId"></code>
    <select id="voice" aria-label="Suara"></select>
    <label class="hint" id="localNamesRow"><input type="checkbox" id="localNames" checked>
      Nama Indonesia (Bali, Wayan, …) diucapkan dengan logat Indonesia</label>
  </div>

  <div class="say">
    <input id="text" type="text" maxlength="400" autocomplete="off" aria-label="Teks untuk diucapkan">
    <button id="speak">Speak</button>
    <button id="stop" disabled>Stop</button>
  </div>

  <p class="hint">Tag ekspresi di teks: [senyum] [kaget] [sedih] [netral] [ketawa]</p>
  <p class="status" id="status"></p>

  <!-- Debug panel: open the page with ?debug to trigger idle actions by hand. -->
  <section class="debug" id="debug" hidden aria-label="Debug aksi">
    <div class="row">
      <button data-action="salam">Om Swastiastu</button>
      <button data-action="udeng">Udeng melorot</button>
      <button data-action="yes">Yes!</button>
      <button data-action="silang">Silang tangan</button>
      <button id="dbgBlink">Kedip</button>
      <button id="dbgStop">Stop aksi</button>
    </div>
    <div class="row">
      <label><input type="checkbox" id="dbgAuto" checked> Aksi otomatis (salam, acak 10–18 s, bosan 30 s)</label>
      <output id="dbgState"></output>
    </div>
  </section>
</main>

<script src="https://unpkg.com/@rive-app/canvas@2.44.0"></script>
<script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.52.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>
<script>
  // ---- Voices ---------------------------------------------------------------
  // hd: Azure HD voice -> reads [laughter] in any language and picks the
  //     emotion up from the text itself. Emotion markers ([happy], [surprised])
  //     are deliberately not sent: they stretched the words next to them
  //     ("Hi" 280 -> 600 ms, "Bali" 200 -> 400 ms with odd vowels).
  // pitch: standard neural voices only (HD voices ignore <prosody>).
  // tested: viseme output already confirmed for this voice.
  const VOICES = [
    { id: "en-US-Andrew:DragonHDLatestNeural", lang: "en-US", hd: true, tested: true,
      label: "Inggris · Andrew HD — hangat, emosi mengikuti isi kalimat" },
    { id: "en-us-goldenspark:DragonHDOmniLatestNeural", lang: "en-US", hd: true,
      label: "Inggris · Goldenspark HD Omni — energik" },
    { id: "en-US-JasonNeural", lang: "en-US", pitch: "+12%",
      label: "Inggris · Jason, nada dinaikkan — terdengar lebih muda" },
    { id: "id-ID-Ardi:DragonHDLatestNeural", lang: "id-ID", hd: true, tested: true,
      label: "Indonesia · Ardi HD — natural, bisa tertawa" },
    { id: "id-ID-ArdiNeural", lang: "id-ID", pitch: "+12%",
      label: "Indonesia · Ardi, nada dinaikkan — terdengar lebih muda" },
  ];
  const SAMPLES = {
    "en-US": "[senyum] Hi! I'm Wayan, from Bali. [kaget] Whoa, you came to visit! [ketawa] Just kidding, I knew you would.",
    "id-ID": "[senyum] Halo! Aku Wayan dari Bali. [kaget] Wah, kamu datang! [ketawa] Bercanda kok.",
  };

  // Tag -> FaceVM.expression. Only [ketawa] also changes the audio (an HD laugh).
  const TAGS = {
    netral: { expr: 0 }, neutral: { expr: 0 },
    senyum: { expr: 1 }, smile: { expr: 1 },
    kaget:  { expr: 2 }, surprised: { expr: 2 },
    sedih:  { expr: 3 }, sad: { expr: 3 },
    ketawa: { expr: 4, laugh: true }, laugh: { expr: 4, laugh: true },
  };

  // ---- Rive -----------------------------------------------------------------
  const $ = (id) => document.getElementById(id);
  let vm = null;
  const rive_ = new rive.Rive({
    src: "wayan.riv",
    canvas: $("c"),
    stateMachine: "State Machine 1",
    autoplay: true,
    autoBind: true,
    onLoad: () => {
      rive_.resizeDrawingSurfaceToCanvas();
      vm = rive_.viewModelInstance;
      waitForSplash();
    },
    onLoadError: () => setStatus("Gagal memuat wayan.riv. Buka lewat server.py, bukan dari file.", true),
  });
  const setNum = (name, v) => { if (vm) vm.number(name).value = v; };

  // The free Rive runtime shows a black splash for a few seconds after loading,
  // and how long depends on the load. Actions wait until it is gone: sampled
  // canvas pixels stop being opaque black once Wayan is drawn.
  function waitForSplash() {
    const ctx = $("c").getContext("2d");
    const { width: w, height: h } = $("c");
    const spots = [[0.1, 0.1], [0.9, 0.1], [0.1, 0.9], [0.9, 0.9], [0.5, 0.95]];
    const black = () => spots.every(([fx, fy]) => {
      const [r, g, b, a] = ctx.getImageData(Math.floor(w * fx), Math.floor(h * fy), 1, 1).data;
      return a > 200 && r + g + b < 30;
    });
    let seen = false;
    const started = performance.now();
    const poll = setInterval(() => {
      if (black()) { seen = true; return; }
      if (!seen && performance.now() - started < 3000) return; // splash not drawn yet (none on paid plans)
      clearInterval(poll);
      act.readyAt = performance.now() + 600;
    }, 150);
  }
  const setTalking = (on) => { if (vm) vm.boolean("talking").value = on; };

  // Gaze, modelled on how people look around:
  // - the eyes jump (saccade) to a new point in 40-160 ms depending on distance,
  //   or follow a moving cursor smoothly (pursuit);
  // - the head follows on a slower spring, and as it turns the eyes ease back
  //   toward the middle, so the head does part of the work;
  // - while holding a point the eyes make tiny micro-saccades;
  // - big jumps usually come with a blink.
  // The cursor wins while it moves over the page. While talking he looks at you.
  // Otherwise he idles: glances somewhere, holds, looks back, rests.
  const clamp1 = (v) => Math.max(-1, Math.min(1, v));
  const target = { x: 0, y: 0 };
  const eye = { x: 0, y: 0, fromX: 0, fromY: 0, toX: 0, toY: 0, t0: 0, dur: 0, pursuit: false };
  const head = { x: 0, y: 0, vx: 0, vy: 0 };
  const cursor = { inside: false, movedAt: -Infinity };
  const idle = { until: 0, stops: [], last: -1, microAt: 0 };
  const HEAD_SHARE = 0.75; // how far the head turns toward what he looks at
  const EYE_RETURN = 0.35; // how much the eyes recentre once the head has turned
  const HEAD_SPRING = 8;   // rad/s; the head settles in about 0.6 s

  // Start a saccade. A micro-saccade jitters the eyes without moving the target,
  // so the head stays put.
  function lookAt(x, y, now, micro = false) {
    const dist = Math.hypot(x - eye.x, y - eye.y);
    if (!micro) { target.x = x; target.y = y; }
    if (dist < 0.005) return;
    Object.assign(eye, { fromX: eye.x, fromY: eye.y, toX: x, toY: y, t0: now, dur: 40 + 80 * Math.min(dist, 1.5), pursuit: false });
    if (!micro && dist > 0.9 && Math.random() < 0.6 && vm) vm.trigger("blink").trigger();
  }

  window.addEventListener("pointermove", (e) => {
    const box = $("c").getBoundingClientRect();
    cursor.inside = true;
    cursor.movedAt = performance.now();
    target.x = clamp1((e.clientX - (box.left + box.width / 2)) / (box.width * 0.6));
    target.y = clamp1((e.clientY - (box.top + box.height * 0.3)) / (box.height * 0.5));
    eye.pursuit = true;
  });
  const cursorGone = () => {
    cursor.inside = false;
    cursor.movedAt = -Infinity;
    const now = performance.now();
    lookAt(0, 0, now); // back to the centre straight away, idle glances follow later
    idle.until = now + 2000;
    idle.stops = [];
  };
  document.addEventListener("pointerout", (e) => { if (!e.relatedTarget) cursorGone(); });
  window.addEventListener("blur", cursorGone);

  // Each glance is one or more [x, y] stops (y < 0 looks up), scaled 60-100%.
  const GLANCES = [
    [[-0.8, 0]], [[0.8, 0]],                      // side
    [[-0.7, -0.6]], [[0.7, -0.6]],                // up, as if thinking
    [[-0.6, 0.5]], [[0.6, 0.5]],                  // down
    [[-0.8, 0], [0.8, 0]], [[0.8, 0], [-0.8, 0]], // look around
  ];
  function idleGaze(now) {
    if (now < idle.until) return;
    let wait;
    if (idle.stops.length) {
      const [x, y] = idle.stops.shift();
      lookAt(x, y, now);
      wait = idle.stops.length ? 350 + Math.random() * 350 : 500 + Math.random() * 800; // hold
    } else if (target.x || target.y) {
      lookAt(0, 0, now);
      wait = 1800 + Math.random() * 2700; // rest at the centre
    } else {
      let i;
      do { i = Math.floor(Math.random() * GLANCES.length); } while (i === idle.last);
      idle.last = i;
      const s = 0.6 + Math.random() * 0.4;
      idle.stops = GLANCES[i].map(([x, y]) => [x * s, y * s]);
      wait = 0;
    }
    idle.until = now + wait;
  }

  let lastFrame = performance.now();
  function gazeFrame(now) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    actionTick(now);
    const talking = session && session.started && !session.done;
    if (cursor.inside && now - cursor.movedAt < 3000) {
      idle.until = now + 1500; // after the cursor stops, wait a little before idling
      idle.stops = [];
    } else {
      eye.pursuit = false;
      if (talking) {
        if (target.x || target.y) lookAt(0, 0, now);
        idle.until = now + 1500;
        idle.stops = [];
      } else if (act.current) {
        idle.until = now + 1500; // the action steers the eyes itself
        idle.stops = [];
      } else {
        idleGaze(now);
      }
      if (now > idle.microAt && now - eye.t0 > eye.dur + 250) {
        lookAt(target.x + (Math.random() - 0.5) * 0.12, target.y + (Math.random() - 0.5) * 0.1, now, true);
        idle.microAt = now + 500 + Math.random() * 900;
      }
    }

    if (eye.pursuit) {
      const k = 1 - Math.exp(-dt / 0.07); // smooth pursuit, ~70 ms behind the cursor
      eye.x += (target.x - eye.x) * k;
      eye.y += (target.y - eye.y) * k;
    } else {
      const p = eye.dur ? Math.min(1, (now - eye.t0) / eye.dur) : 1;
      const e = 1 - (1 - p) ** 3; // fast start, soft landing
      eye.x = eye.fromX + (eye.toX - eye.fromX) * e;
      eye.y = eye.fromY + (eye.toY - eye.fromY) * e;
    }

    // Critically damped spring: the head lags the eyes and settles without wobble.
    for (const [k, v] of [["x", "vx"], ["y", "vy"]]) {
      const a = HEAD_SPRING ** 2 * (target[k] * HEAD_SHARE - head[k]) - 2 * HEAD_SPRING * head[v];
      head[v] += a * dt;
      head[k] += head[v] * dt;
    }

    setNum("lookX", clamp1(eye.x - EYE_RETURN * head.x));
    setNum("lookY", clamp1(eye.y - EYE_RETURN * head.y));
    setNum("headX", head.x);
    setNum("headY", head.y);
    requestAnimationFrame(gazeFrame);
  }
  requestAnimationFrame(gazeFrame); // first frame runs after the script, once `session` exists

  // ---- Idle actions -----------------------------------------------------------
  // The Rive layer "Aksi" plays an action while FaceVM.action holds its number and
  // eases back to rest when it returns to 0. The page decides when: Om Swastiastu
  // once on load, a random fidget every 10-18 s, crossed arms after 30 s without
  // any input. Nothing starts while the cursor moves or Wayan talks, and talking
  // cancels a running action. Cues time the face to each action's keyframes.
  const now_ = () => performance.now();
  const ACTIONS = {
    salam: { id: 1, ms: 2000, cues: [[600, () => setNum("expression", 1)], [2600, () => setNum("expression", 0)]] },
    udeng: { id: 2, ms: 1700, cues: [
      [230, () => setNum("expression", 2)],  // the udeng lands on his eyes
      [1200, () => setNum("expression", 4)], // pushed back up: a little laugh
      [1900, () => setNum("expression", 1)],
      [3200, () => setNum("expression", 0)],
    ] },
    yes: { id: 3, ms: 1500, cues: [
      [250, () => setNum("expression", 1)],
      [560, () => setNum("visemeId", 1)],    // "Yes!" on the pull-down
      [900, () => setNum("visemeId", 0)],
      [2600, () => setNum("expression", 0)],
    ] },
    silang: { id: 4, ms: 3170, cues: [
      [300, () => lookAt(0.7, 0.1, now_())], // glance away, unimpressed...
      [1500, () => lookAt(0, 0, now_())],    // ...then back at you, brow up
    ] },
  };
  const FIDGETS = ["udeng", "yes"];
  const act = { current: null, last: null, timers: [], readyAt: Infinity, greeted: false,
                nextAt: 0, lastInput: now_(), bored: false, auto: true };

  function playAction(name) {
    cancelAction();
    const a = ACTIONS[name];
    act.current = act.last = name;
    setNum("expression", 0); // start from a neutral face; the cues set the rest
    setNum("action", a.id);
    act.timers = a.cues.map(([ms, fn]) => setTimeout(fn, ms));
    act.timers.push(setTimeout(() => { if (act.current === name) { setNum("action", 0); act.current = null; } }, a.ms));
  }

  function cancelAction() {
    act.timers.forEach(clearTimeout);
    act.timers = [];
    if (!act.current) return;
    act.current = null;
    setNum("action", 0);
    setNum("visemeId", 0);
  }

  const noteInput = () => { act.lastInput = now_(); act.bored = false; };
  ["pointermove", "keydown", "pointerdown"].forEach((ev) => window.addEventListener(ev, noteInput));

  function actionTick(now) {
    const talking = session && session.started && !session.done;
    if (talking) {
      cancelAction();
      act.nextAt = Math.max(act.nextAt, now + 6000);
      return;
    }
    if (act.current || !vm || now < act.readyAt || !act.auto) return;
    if (cursor.inside && now - cursor.movedAt < 3000) return; // only while he is left alone
    if (!act.greeted) {
      act.greeted = true;
      playAction("salam");
      act.nextAt = now + 10000 + Math.random() * 8000;
    } else if (!act.bored && now - act.lastInput > 30000) {
      act.bored = true;
      playAction("silang");
      act.nextAt = now + 12000;
    } else if (now > act.nextAt) {
      const options = FIDGETS.filter((f) => f !== act.last);
      playAction(options[Math.floor(Math.random() * options.length)]);
      act.nextAt = now + 10000 + Math.random() * 8000;
    }
  }

  // Debug panel (?debug): play any action now, switch the scheduler off, watch the state.
  if (new URLSearchParams(location.search).has("debug")) {
    $("debug").hidden = false;
    document.querySelectorAll("#debug [data-action]").forEach((b) => {
      b.onclick = () => playAction(b.dataset.action);
    });
    $("dbgBlink").onclick = () => { if (vm) vm.trigger("blink").trigger(); };
    $("dbgStop").onclick = cancelAction;
    $("dbgAuto").onchange = (e) => { act.auto = e.target.checked; };
    setInterval(() => {
      const next = Math.max(0, (act.nextAt - now_()) / 1000);
      $("dbgState").textContent = act.current ? `sedang: ${act.current}`
        : act.auto ? `aksi acak berikutnya ±${next.toFixed(0)} s` : "otomatis mati";
    }, 250);
  }

  // ---- UI -------------------------------------------------------------------
  const setStatus = (msg, isError = false) => { $("status").textContent = msg; $("status").className = "status" + (isError ? " error" : ""); };
  VOICES.forEach((v, i) => $("voice").add(new Option(v.label + (v.tested ? "" : " (viseme belum diuji)"), i)));
  const currentVoice = () => VOICES[Number($("voice").value)];
  // English HD voices can switch accent mid-sentence with <lang>; standard voices can't.
  const canLocalize = (v) => v.hd && v.lang.startsWith("en");
  const showVoice = () => {
    const v = currentVoice();
    $("voiceId").textContent = v.id;
    $("localNamesRow").style.visibility = canLocalize(v) ? "visible" : "hidden";
    if (!$("text").value || Object.values(SAMPLES).includes($("text").value)) $("text").value = SAMPLES[v.lang];
  };
  $("voice").onchange = showVoice;
  showVoice();

  // ---- SSML with tag positions ---------------------------------------------
  const escapeXml = (s) => s.replace(/[<>&'"]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", "'": "&apos;", '"': "&quot;" }[c]));

  // Indonesian names an American voice says with the wrong stress ("Bali", "Wayan").
  const LOCAL_NAMES = /\b(Bali|Wayan|Made|Kadek|Nyoman|Komang|Ketut|Putu|Gede|Ubud|Denpasar|Kuta|Sanur|Nusa|udeng|kamen|Galungan|Nyepi)\b/g;
  // HD voices guess the language per sentence and read a lone "Hi!" as Indonesian "hii",
  // so English text is pinned to the voice's language and only the names switch.
  const inLang = (lang, s) => s.replace(/^(\s*)([\s\S]*?)(\s*)$/,
    (_, a, body, z) => body ? `${a}<lang xml:lang="${lang}">${body}</lang>${z}` : a + z);
  const localize = (text, voice) => {
    if (!canLocalize(voice)) return text;
    if (!$("localNames").checked) return inLang(voice.lang, text);
    return text.split(LOCAL_NAMES).map((s, i) => inLang(i % 2 ? "id-ID" : voice.lang, s)).join("");
  };

  // Returns the SSML and, for each known tag, where its text resumes in the SSML string.
  // Azure's wordBoundary.textOffset indexes that same string, which is how tags meet audio time.
  function buildSsml(raw, voice) {
    const head = `<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" ` +
      `xmlns:mstts="https://www.w3.org/2001/mstts" xml:lang="${voice.lang}"><voice name="${voice.id}">` +
      (voice.pitch ? `<prosody pitch="${voice.pitch}">` : "");
    const tail = (voice.pitch ? "</prosody>" : "") + "</voice></speak>";
    let body = "";
    let plain = 0; // length of spoken text so far, for voices that send no word positions
    const tags = [];
    for (const part of raw.split(/(\[[^\]]*\])/)) {
      const m = part.match(/^\[([^\]]*)\]$/);
      if (!m) { body += localize(escapeXml(part), voice); plain += part.length; continue; }
      const tag = TAGS[m[1].trim().toLowerCase()];
      if (!tag) continue; // unknown tags are dropped, never spoken
      const before = head.length + body.length;
      const leading = body.trim() === "";
      if (voice.hd && tag.laugh) body += " [laughter] ";
      tags.push({ ...tag, before, leading, plainAt: plain });
    }
    tags.forEach((t) => (t.plainFrac = plain ? t.plainAt / plain : 0));
    return { ssml: head + body + tail, tags };
  }

  // ---- Speaking -------------------------------------------------------------
  // Azure's visemes and word times are estimates. On HD voices they keep the
  // mouth open into silences, report some words up to a second early, and put
  // the laugh on the word before the actual laugh. So the page plays the audio
  // itself (Web Audio) and measures its loudness every 10 ms. Synthesis runs
  // about 3x faster than playback, so the loudness of what is about to be
  // heard is always known in advance:
  // - the mouth is closed whenever the audio is silent,
  // - expressions switch inside the silence just before the next word starts,
  // - the laugh face covers the laugh that is actually heard.
  const RATE = 24000;
  const FRAME_MS = 10;
  const FRAME = RATE * FRAME_MS / 1000;
  const SILENT = 150;  // RMS of 16-bit PCM: measured pauses stay under 70, quiet speech is 300+
  const LEAD_S = 0.25; // audio buffered before playback starts
  let session = null;
  let ctx = null;

  async function speak() {
    stop();
    noteInput();
    cancelAction();
    const raw = $("text").value.trim();
    if (!raw) return;
    const voice = currentVoice();
    // Created inside the click, otherwise the browser refuses to play it.
    ctx = ctx || new AudioContext();
    ctx.resume();
    setStatus("Menyiapkan suara…");
    $("speak").disabled = true;

    let auth;
    try {
      const res = await fetch("/api/speech-token");
      auth = await res.json();
      if (!res.ok) throw new Error(auth.error || res.statusText);
    } catch (err) {
      setStatus("Token Azure gagal: " + err.message, true);
      $("speak").disabled = false;
      return;
    }

    const sdk = SpeechSDK;
    const config = sdk.SpeechConfig.fromAuthorizationToken(auth.token, auth.region);
    config.speechSynthesisOutputFormat = sdk.SpeechSynthesisOutputFormat.Raw24Khz16BitMonoPcm;
    const synth = new sdk.SpeechSynthesizer(config, null); // no SDK playback: the page plays it
    const { ssml, tags } = buildSsml(raw, voice);

    const s = session = {
      synth, tags, visemes: [], words: [], events: [], env: [], sources: [],
      pending: [], oddByte: null, receivedMs: 0, synthDone: false, totalMs: 0,
      started: false, startAt: 0, nextAt: 0, done: false, laughing: false, expr: 0,
    };

    synth.visemeReceived = (_, e) => s.visemes.push({ ms: e.audioOffset / 1e4, id: e.visemeId });
    const WORD = sdk.SpeechSynthesisBoundaryType && sdk.SpeechSynthesisBoundaryType.Word;
    synth.wordBoundary = (_, e) => {
      if (WORD !== undefined && e.boundaryType !== undefined && e.boundaryType !== WORD) return;
      s.words.push({ ms: e.audioOffset / 1e4, dur: (e.duration || 0) / 1e4, off: e.textOffset });
    };
    synth.synthesizing = (_, e) => { if (session === s && !s.done) addAudio(s, e.result.audioData); };

    synth.speakSsmlAsync(ssml, (result) => {
      s.synthDone = true;
      s.totalMs = s.receivedMs;
      if (result.reason !== sdk.ResultReason.SynthesizingAudioCompleted) {
        setStatus("Azure gagal: " + (result.errorDetails || result.reason), true);
        finish(s);
      } else if (s.visemes.length === 0) {
        setStatus("Suara ini tidak mengirim viseme, jadi mulut tidak bergerak. Pilih suara lain.", true);
      }
      synth.close();
    }, (err) => { setStatus("Azure gagal: " + err, true); finish(s); });
  }

  // Queue one chunk of raw PCM right after the previous one and measure its loudness.
  function addAudio(s, buffer) {
    let bytes = new Uint8Array(buffer);
    if (s.oddByte) { const b = new Uint8Array(bytes.length + 1); b[0] = s.oddByte[0]; b.set(bytes, 1); bytes = b; s.oddByte = null; }
    if (bytes.length % 2) { s.oddByte = bytes.slice(-1); bytes = bytes.slice(0, -1); }
    if (!bytes.length) return;
    const pcm = new Int16Array(bytes.buffer, bytes.byteOffset, bytes.length / 2);

    for (const v of pcm) {
      s.pending.push(v);
      if (s.pending.length === FRAME) {
        s.env.push(Math.sqrt(s.pending.reduce((sum, x) => sum + x * x, 0) / FRAME));
        s.pending = [];
      }
    }

    const audio = ctx.createBuffer(1, pcm.length, RATE);
    audio.getChannelData(0).set(Float32Array.from(pcm, (x) => x / 32768));
    const src = ctx.createBufferSource();
    src.buffer = audio;
    src.connect(ctx.destination);
    const now = ctx.currentTime;
    if (!s.started) {
      s.started = true;
      s.startAt = s.nextAt = now + LEAD_S;
      setStatus("");
      $("stop").disabled = false;
      requestAnimationFrame(() => frame(s));
    } else if (s.nextAt < now + 0.02) {
      // The network fell behind playback: resume a moment later and shift the clock with it.
      const late = now + 0.05 - s.nextAt;
      s.startAt += late;
      s.nextAt += late;
    }
    src.start(s.nextAt);
    s.nextAt += audio.duration;
    s.sources.push(src);
    s.receivedMs += pcm.length / RATE * 1000;
  }

  // Milliseconds into the speech that is leaving the speakers right now.
  function audioNow(s) {
    const ts = ctx.getOutputTimestamp && ctx.getOutputTimestamp();
    const at = ts && ts.contextTime > 0 ? ts.contextTime : ctx.currentTime - (ctx.outputLatency || 0);
    return (at - s.startAt) * 1000;
  }

  const loudAt = (s, ms) => (s.env[Math.floor(ms / FRAME_MS)] || 0) > SILENT;
  const loudNear = (s, ms, span) => {
    for (let t = ms - span; t <= ms + span; t += FRAME_MS) if (loudAt(s, t)) return true;
    return false;
  };

  // Silent stretches of at least minMs in the audio measured so far.
  function silences(s, minMs) {
    const out = [];
    let start = null;
    s.env.forEach((e, i) => {
      if (e <= SILENT) { if (start === null) start = i * FRAME_MS; return; }
      if (start !== null && i * FRAME_MS - start >= minMs) out.push({ start, end: i * FRAME_MS });
      start = null;
    });
    if (start !== null && s.synthDone && s.env.length * FRAME_MS - start >= minMs) out.push({ start, end: s.env.length * FRAME_MS });
    return out;
  }

  // Stretches where Azure gives no mouth shape (viseme 0), merged.
  function shapelessRuns(s) {
    const runs = [];
    s.visemes.forEach((v, i) => {
      if (v.id !== 0) return;
      const end = s.visemes[i + 1] ? s.visemes[i + 1].ms : s.receivedMs;
      const prev = runs[runs.length - 1];
      if (prev && Math.abs(prev.end - v.ms) < 1) prev.end = end;
      else runs.push({ start: v.ms, end });
    });
    return runs;
  }

  // Azure sends offset -1 for some words (the first one, the one after [laughter]
  // inside <lang>). Such a word sits just before the next word with a real offset;
  // until that word arrives its offset stays unknown (NaN matches no tag).
  function wordsWithOffsets(s) {
    let nextOff = s.synthDone ? Infinity : NaN;
    return s.words.slice().reverse().map((w) => {
      if (w.off >= 0) { nextOff = w.off; return w; }
      return { ...w, off: nextOff - 1 };
    }).reverse();
  }

  // Turn tags into timed face changes. Where a tag lands is first estimated from
  // the word after it (or, for voices that report few words such as id-ID-Ardi
  // HD, from its share of the text), then corrected against the measured audio.
  function resolveTags(s) {
    const words = wordsWithOffsets(s);
    for (const tag of s.tags) {
      if (tag.done) continue;
      if (tag.leading && !tag.laugh) {
        // The opening face is already on before the first sound.
        tag.done = true;
        s.events.push({ ms: -Infinity, run: () => applyExpr(s, tag.expr) });
        continue;
      }
      let target;
      const next = words.find((w) => w.off >= tag.before);
      if (next) target = next.ms;
      else if (s.synthDone) target = guessFromText(s, tag);
      else continue;
      if (!s.synthDone && s.receivedMs < target + 1200) continue; // audio around it not measured yet
      tag.done = true;
      if (tag.laugh) placeLaugh(s, target);
      else placeExpr(s, tag.expr, target);
    }
    s.events.sort((a, b) => a.ms - b.ms);
  }

  // Long pauses are laughs and hold no text, so they are left out of the proportion.
  function guessFromText(s, tag) {
    const long = silences(s, 700);
    let guess = tag.plainFrac * (s.totalMs - long.reduce((sum, p) => sum + p.end - p.start, 0));
    for (const p of long) if (p.start <= guess) guess += p.end - p.start;
    return guess;
  }

  // Switch inside a silence near the estimate, just before the sound resumes, so
  // the new face never lands on the end of the previous words. Tags open sentences,
  // so a long pause beats a closer comma pause.
  function placeExpr(s, expr, target) {
    const dist = (p) => (target < p.start ? p.start - target : target > p.end ? target - p.end : 0);
    const score = (p) => (p.end - p.start) - dist(p) / 2;
    const gap = silences(s, 100).filter((p) => dist(p) <= 1000)
      .reduce((best, p) => (!best || score(p) > score(best) ? p : best), null);
    const at = gap ? Math.max(gap.start, gap.end - 120) : Math.max(0, target - 60);
    s.events.push({ ms: at, run: () => applyExpr(s, expr) });
    return at;
  }

  // Bursts of sound in the audio measured so far; gaps up to 100 ms are bridged.
  function sounds(s) {
    const out = [];
    let cur = null;
    s.env.forEach((e, i) => {
      if (e <= SILENT) return;
      const t = i * FRAME_MS;
      if (cur && t - cur.end <= 100) cur.end = t + FRAME_MS;
      else out.push(cur = { start: t, end: t + FRAME_MS });
    });
    return out;
  }

  // The heard laugh: bursts of sound that are mostly inside long stretches with no
  // mouth shapes. Near the word after [laughter], take the biggest group of them,
  // and end the laugh face before the next words start.
  function placeLaugh(s, target) {
    const runs = shapelessRuns(s).filter((r) => r.end - r.start >= 300);
    const all = sounds(s);
    const bursts = all.filter((g) => {
      if (g.end < target - 2500 || g.start > target + 300) return false;
      let loud = 0, shapeless = 0;
      for (let ms = g.start; ms < g.end; ms += FRAME_MS) {
        if (!loudAt(s, ms)) continue;
        loud++;
        if (runs.some((r) => ms >= r.start && ms < r.end)) shapeless++;
      }
      g.n = shapeless;
      return loud && shapeless / loud >= 0.7;
    });
    const groups = [];
    for (const g of bursts) {
      const prev = groups[groups.length - 1];
      if (prev && g.start - prev.end <= 400) { prev.end = g.end; prev.n += g.n; }
      else groups.push({ ...g });
    }
    const laugh = groups.reduce((best, g) => (!best || g.n > best.n ? g : best), null);
    if (laugh && laugh.n >= 5) {
      const after = all.find((g) => g.start >= laugh.end);
      const end = Math.min(laugh.end + 120, after ? after.start - 30 : Infinity);
      // A laugh settles into a smile rather than snapping back to the previous face.
      s.events.push({ ms: laugh.start - 40, run: () => { s.laughing = true; applyExpr(s, 4); } });
      s.events.push({ ms: end, run: () => { s.laughing = false; applyExpr(s, 1); } });
    } else {
      // This voice did not laugh out loud: show the face in the pause, then smile.
      const at = placeExpr(s, 4, target);
      s.events.push({ ms: at + 800, run: () => applyExpr(s, 1) });
    }
  }

  const applyExpr = (s, e) => { s.expr = e; setNum("expression", e); };

  // Azure's shape at time t; where there is sound but no shape yet (shapes trail
  // the sound by ~100 ms at word starts) use the next shape, else the last one.
  function visemeFor(s, t) {
    let id = 0, last = 1;
    for (const v of s.visemes) { if (v.ms > t) break; id = v.id; if (v.id) last = v.id; }
    if (id) return id;
    const soon = s.visemes.find((v) => v.ms > t && v.ms <= t + 250 && v.id);
    return soon ? soon.id : last;
  }

  function frame(s) {
    if (s !== session || s.done) return;
    const t = audioNow(s);
    resolveTags(s);
    while (s.events.length && s.events[0].ms <= t) s.events.shift().run();
    if (s.synthDone && t >= s.totalMs + 100) { finish(s); return; }
    let id = 0;
    if (t >= 0 && loudNear(s, t, 20)) id = s.laughing ? (Math.floor(t / 110) % 2 ? 2 : 1) : visemeFor(s, t);
    setNum("visemeId", id);
    setTalking(t >= 0 && !s.laughing && loudNear(s, t, 250));
    requestAnimationFrame(() => frame(s));
  }

  function finish(s) {
    if (s.done) return;
    s.done = true;
    s.events = [];
    s.laughing = false;
    setNum("visemeId", 0);
    setTalking(false);
    $("speak").disabled = false;
    $("stop").disabled = true;
    setTimeout(() => { if (session === s || !session || session.done) setNum("expression", 0); }, 1500);
  }

  function stop() {
    if (!session || session.done) return;
    for (const src of session.sources) { try { src.stop(); } catch (_) {} }
    try { session.synth.close(); } catch (_) {}
    finish(session);
  }

  $("speak").onclick = speak;
  $("stop").onclick = stop;
  $("text").addEventListener("keydown", (e) => { if (e.key === "Enter") speak(); });
</script>
</body>
</html>
