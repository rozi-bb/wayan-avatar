<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bandingkan Background</title>
<style>
  body { margin: 0; padding: 16px; background: #161616; color: #eee; font: 14px system-ui, sans-serif; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  p { margin: 0 0 14px; color: #aaa; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  figure { margin: 0; width: min(320px, 44vw); }
  /* Same stage as web/index.html: 2:3, background cover, Wayan at 78% standing 2% above the bottom. */
  .stage { position: relative; width: 100%; aspect-ratio: 2 / 3; border-radius: 24px; overflow: hidden; background: center / cover; }
  .stage img { position: absolute; left: 50%; bottom: 2%; width: 78%; transform: translateX(-50%); }
  figcaption { padding: 8px 2px; }
</style>
</head>
<body>
<h1>Rumah adat (C, langit biru) vs Pura B</h1>
<p>Panggung 2:3 seperti di halaman, Wayan berdiri 2% dari bawah.</p>
<div class="row">
  <figure><div class="stage" style="background-image:url(../vector/bg_pura2_2.svg)"><img src="backgrounds/wayan.png"></div><figcaption>B. Pura, Wayan 78% (dipakai sekarang)</figcaption></figure>
  <figure><div class="stage" style="background-image:url(../vector/bg_rumah_blue.svg)"><img src="backgrounds/wayan.png" style="width:66%"></div><figcaption>C. Rumah adat, langit biru, Wayan 66%</figcaption></figure>
</div>
</body>
</html>
