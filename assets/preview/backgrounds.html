<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilihan Background</title>
<style>
  body { margin: 0; padding: 16px; background: #161616; color: #eee; font: 14px system-ui, sans-serif; }
  h1 { font-size: 17px; margin: 0 0 12px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  figure { margin: 0; width: 200px; }
  .stage { position: relative; aspect-ratio: 2 / 3; border-radius: 18px; overflow: hidden; }
  .stage img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage .bg { object-fit: cover; }
  figcaption { padding: 6px 2px; }
</style>
</head>
<body>
<h1>Pilihan background (di belakang Wayan, ukuran panggung halaman 2:3)</h1>
<div class="row">
  <figure><div class="stage"><img class="bg" src="../vector/bg_pura.svg"><img src="backgrounds/wayan.png"></div><figcaption>1. Pura</figcaption></figure>
  <figure><div class="stage"><img class="bg" src="../vector/bg_sawah.svg"><img src="backgrounds/wayan.png"></div><figcaption>2. Sawah terasering</figcaption></figure>
  <figure><div class="stage"><img class="bg" src="../vector/bg_pantai.svg"><img src="backgrounds/wayan.png"></div><figcaption>3. Pantai</figcaption></figure>
</div>
<h1 style="margin-top:18px">Background saja</h1>
<div class="row">
  <figure><div class="stage"><img class="bg" src="../vector/bg_pura.svg"></div><figcaption>1. Pura</figcaption></figure>
  <figure><div class="stage"><img class="bg" src="../vector/bg_sawah.svg"></div><figcaption>2. Sawah terasering</figcaption></figure>
  <figure><div class="stage"><img class="bg" src="../vector/bg_pantai.svg"></div><figcaption>3. Pantai</figcaption></figure>
</div>
</body>
</html>
