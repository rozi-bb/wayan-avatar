<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Wayan head turn</title>
<style>
  body { margin: 0; background: #1d1d1d; color: #ddd; font: 12px system-ui; padding: 8px; }
  #live { width: 300px; aspect-ratio: 2 / 3; display: block; }
  .grid { display: grid; grid-template-columns: repeat(var(--cols, 6), 1fr); gap: 4px; margin-top: 8px; }
  figure { margin: 0; background: #2a2a2a; }
  figure canvas { display: block; width: 100%; }
  figcaption { padding: 2px 4px; }
  h2 { font-size: 13px; margin: 12px 0 0; }
</style>
</head>
<body>
<canvas id="live" width="900" height="1350"></canvas>
<div id="out"></div>
<script src="https://unpkg.com/@rive-app/canvas@2.44.0"></script>
<script>
  // Frame-by-frame review of the head turn in the real runtime (binds only run here).
  //   ?mode=grid           fixed headX/headY poses, eyes looking the same way
  //   ?mode=seq&x=0.8&y=0  one idle glance as index.html plays it, every frame at 60 fps
  //   ?mode=act&action=3   a gesture on the Aksi layer (3 = udeng), snapped as it plays in real time
  //   options: share, spring, zeta (damping, 1 = no overshoot; defaults match index.html), frames, back (frame the eyes return), every, sink,
  //            ms (act: how long to record), crop (x,y,w,h as fractions of the canvas), bg (hex backdrop, e.g. 6ba8d2)
  // Head crop, as fractions of the canvas (the artboard fills it).
  const q = new URLSearchParams(location.search);
  const CROP = q.get("crop") ? q.get("crop").split(",").map(Number) : [0.215, 0.085, 0.625, 0.449];
  const HEAD_SHARE = +(q.get("share") || 1), EYE_RETURN = 0.35, HEAD_SPRING = +(q.get("spring") || 8), ZETA = +(q.get("zeta") || 0.75);
  const canvas = document.getElementById("live");
  let vmi;
  const set = (name, v) => { vmi.number(name).value = v; };
  const frame = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  function section(title, cols) {
    const h = document.createElement("h2"); h.textContent = title;
    const g = document.createElement("div"); g.className = "grid"; g.style.setProperty("--cols", cols);
    document.getElementById("out").append(h, g);
    return g;
  }
  function snap(grid, label) {
    const [x, y, w, h] = CROP.map((f, i) => f * (i % 2 ? canvas.height : canvas.width));
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const cx = c.getContext("2d");
    if (q.get("bg")) { cx.fillStyle = "#" + q.get("bg"); cx.fillRect(0, 0, w, h); } // white parts show on a backdrop
    cx.drawImage(canvas, x, y, w, h, 0, 0, w, h);
    const f = document.createElement("figure"), cap = document.createElement("figcaption");
    cap.textContent = label;
    f.append(c, cap);
    grid.append(f);
    // ?sink=folder also saves each frame through a local receiver on :8768 (review at full size)
    if (q.get("sink")) c.toBlob((b) => fetch(`http://127.0.0.1:8768/${label.replace(/[^\w.-]+/g, "_")}.png`,
      { method: "POST", body: b, headers: { "X-Folder": q.get("sink") } }));
  }

  async function grid() {
    const g = section("headX, headY (mata searah, dikurangi 35% kepala)", 3);
    for (const y of [-1, 0, 1]) for (const x of [-1, 0, 1]) {
      set("headX", x); set("headY", y);
      set("lookX", x - EYE_RETURN * x); set("lookY", y - EYE_RETURN * y);
      await frame(); await wait(60);
      snap(g, `h ${x} v ${y}`);
    }
  }

  // Same model as index.html: saccade with cubic ease-out, head on a critically damped spring.
  async function seq() {
    const tx = +(q.get("x") ?? 0.8), ty = +(q.get("y") ?? 0);
    const g = section(`lirik ke (${tx}, ${ty}), lalu kembali · share ${HEAD_SHARE} · spring ${HEAD_SPRING} · zeta ${ZETA}`, +(q.get("cols") || 8));
    const eye = { x: 0, y: 0 }, head = { x: 0, y: 0, vx: 0, vy: 0 };
    const dt = 1 / 60, dur = 40 + 80 * Math.min(Math.hypot(tx, ty), 1.5);
    const back = +(q.get("back") || 60), total = +(q.get("frames") || 100), every = +(q.get("every") || 2);
    for (let f = 0; f <= total; f++) {
      const leg = f < back ? [0, 0, tx, ty, f] : [tx, ty, 0, 0, f - back];
      const p = Math.min(1, (leg[4] * dt * 1000) / dur), e = 1 - (1 - p) ** 3;
      eye.x = leg[0] + (leg[2] - leg[0]) * e; eye.y = leg[1] + (leg[3] - leg[1]) * e;
      const target = f < back ? [tx, ty] : [0, 0];
      [["x", "vx", 0], ["y", "vy", 1]].forEach(([k, v, i]) => {
        const a = HEAD_SPRING ** 2 * (target[i] * HEAD_SHARE - head[k]) - 2 * ZETA * HEAD_SPRING * head[v];
        head[v] += a * dt; head[k] += head[v] * dt;
      });
      set("lookX", eye.x - EYE_RETURN * head.x); set("lookY", eye.y - EYE_RETURN * head.y);
      set("headX", head.x); set("headY", head.y);
      await frame();
      if (f % every === 0) snap(g, `f${String(f).padStart(3, "0")} h ${head.x.toFixed(2)} v ${head.y.toFixed(2)}`);
    }
  }

  // A gesture as the page plays it: action on, recorded on every animation frame for `ms`, then back to rest.
  // Sway and Idle keep running, so the front forearm can be checked against the body while they move.
  async function act() {
    const action = +(q.get("action") || 3), ms = +(q.get("ms") || 3000), every = +(q.get("every") || 1);
    const g = section(`action ${action}, ${ms} ms`, +(q.get("cols") || 8));
    set("action", action);
    const t0 = performance.now();
    for (let n = 0; performance.now() - t0 < ms; n++) {
      await new Promise((r) => requestAnimationFrame(r));
      if (n % every === 0) snap(g, `t${String(Math.round(performance.now() - t0)).padStart(4, "0")}`);
    }
    set("action", 0);
  }

  const r = new rive.Rive({
    src: "wayan.riv", canvas, stateMachines: "State Machine 1", autoplay: true, autoBind: true,
    onLoad: async () => {
      vmi = r.viewModelInstance;
      // Free-plan splash is black; wait until the face (skin) shows, then a little more.
      const probe = document.createElement("canvas").getContext("2d", { willReadFrequently: true });
      probe.canvas.width = probe.canvas.height = 1;
      for (;;) {
        probe.drawImage(canvas, canvas.width * 0.5, canvas.height * 0.36, 1, 1, 0, 0, 1, 1);
        if (probe.getImageData(0, 0, 1, 1).data[0] > 180) break;
        await wait(200);
      }
      await wait(800);
      const mode = q.get("mode");
      await (mode === "seq" ? seq() : mode === "act" ? act() : grid());
      document.title = "done";
    },
  });
</script>
</body>
</html>
