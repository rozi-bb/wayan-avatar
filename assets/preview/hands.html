<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Tangan & silang tangan</title>
<style>
  body { margin: 0; padding: 16px; background: #1d1d1d; color: #f2f2f2; font: 15px system-ui, sans-serif; }
  h2 { font-size: 16px; margin: 18px 0 8px; }
  .card { background: #8a8a8a; border-radius: 12px; padding: 10px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row .card { flex: 1; min-width: 220px; text-align: center; }
  .card img { max-width: 100%; display: block; margin: 0 auto; }
  .stack { position: relative; }
  .stack img + img { position: absolute; inset: 0; margin: 0 auto; opacity: .55; }
</style>
</head>
<body>
  <h2>Lembar tangan (hands.svg)</h2>
  <div class="card"><img src="../vector/hands.svg" alt="Enam tangan"></div>

  <h2>Silang tangan vs master (arms_crossed.svg)</h2>
  <div class="row">
    <div class="card"><div>Master</div><img src="../vector/wayan_master.svg" style="height:420px" alt="Master"></div>
    <div class="card"><div>Silang tangan</div><img src="../vector/arms_crossed.svg" style="height:420px" alt="Silang tangan"></div>
    <div class="card"><div>Tumpuk (cek sejajar)</div><div class="stack"><img src="../vector/wayan_master.svg" style="height:420px" alt=""><img src="../vector/arms_crossed.svg" style="height:420px" alt=""></div></div>
  </div>
  <h2>Tangan menyatu / Om Swastiastu (hands_together.svg)</h2>
  <div class="row">
    <div class="card"><div>Master</div><img src="../vector/wayan_master.svg" style="height:420px" alt="Master"></div>
    <div class="card"><div>Tangan menyatu</div><img src="../vector/hands_together.svg" style="height:420px" alt="Tangan menyatu"></div>
    <div class="card"><div>Tumpuk (cek sejajar)</div><div class="stack"><img src="../vector/wayan_master.svg" style="height:420px" alt=""><img src="../vector/hands_together.svg" style="height:420px" alt=""></div></div>
  </div>
</body>
</html>
