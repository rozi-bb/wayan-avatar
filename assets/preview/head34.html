<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kepala 3/4</title>
<style>
  body { margin: 0; background: #1d1d1d; color: #ddd; font: 13px system-ui; padding: 12px; }
  h1 { font-size: 17px; margin: 0 0 4px; } p { margin: 0 0 10px; color: #aaa; max-width: 760px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .row + .row { margin-top: 8px; }
  figure { margin: 0; background: #6ba8d2; }
  .head { aspect-ratio: 1050 / 1000; overflow: hidden; position: relative; }
  .head img { position: absolute; width: 128.29%; left: -14.29%; top: -6.1%; }   /* SVG x 150-1200, y 80-1080 */
  .full img { width: 100%; display: block; }
  figcaption { background: #2a2a2a; padding: 4px 6px; }
  @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>Kepala menoleh 3/4 (Gemini → vectorize)</h1>
<p>SVG hasil vectorize di atas latar netral, kanvas sama dengan master (1347×2048), jadi badan sejajar. Tengah: master sekarang.</p>
<div class="row">
  <figure><div class="head"><img src="../vector/head34_left.svg"></div><figcaption>Menoleh ke kiri gambar · 42 path</figcaption></figure>
  <figure><div class="head"><img src="../vector/wayan_master.svg"></div><figcaption>Master (lurus)</figcaption></figure>
  <figure><div class="head"><img src="../vector/head34_right.svg"></div><figcaption>Menoleh ke kanan gambar · 38 path</figcaption></figure>
</div>
<div class="row">
  <figure class="full"><img src="../vector/head34_left.svg"></figure>
  <figure class="full"><img src="../vector/wayan_master.svg"></figure>
  <figure class="full"><img src="../vector/head34_right.svg"></figure>
</div>
</body>
</html>
